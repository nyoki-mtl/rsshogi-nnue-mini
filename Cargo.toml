[package]
name = "rsshogi-nnue-mini"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A small educational USI shogi engine built with the rsshogi ecosystem"
repository = "https://github.com/nyoki-mtl/rsshogi-nnue-mini"
publish = false

[lib]
crate-type = ["rlib"]

[[bin]]
name = "rsshogi-nnue-mini"
path = "src/main.rs"
test = false

[features]
default = []
tuning = []
stats = []
embedded-rsnn = []
c-api = []

[dependencies]
rsshogi = "=1.7.2"
rsshogi-usi = "=0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"

[profile.release]
lto = "thin"

[profile.production]
inherits = "release"
lto = "fat"
codegen-units = 1
