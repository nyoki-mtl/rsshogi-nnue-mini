[package]
name = "rsshogi-nnue-mini"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A small educational USI shogi engine built with the rsshogi ecosystem"
repository = "https://github.com/nyoki-mtl/rsshogi-nnue-mini"
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = []
tuning = []
stats = []
embedded-rsnn = []
c-api = []

[workspace]

[dependencies]
rsshogi = "=1.7.2"
rsshogi-usi = "=0.2.0"
rsnn-package = { path = "crates/rsnn-package" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
