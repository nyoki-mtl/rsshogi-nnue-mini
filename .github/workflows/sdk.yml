name: SDK build artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin
      - name: Require Apple Silicon runtime checks
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package XCFramework, type-check Swift 6 wrapper, and run host smoke
        run: bash scripts/build_apple.sh
      - uses: actions/upload-artifact@v4
        with:
          name: apple-sdk
          path: dist/apple/
          if-no-files-found: error

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package Wasm SDK
        shell: pwsh
        run: ./scripts/build_wasm.ps1
      - run: node --check bindings/wasm/mini.js
      - run: node --check bindings/wasm/worker.js
      - run: node bindings/wasm/check.mjs dist/wasm-sdk/rsshogi_nnue_mini.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-sdk
          path: dist/wasm-sdk/
          if-no-files-found: error
