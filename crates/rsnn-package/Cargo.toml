[package]
name = "rsnn-package"
version = "0.1.0"
edition = "2024"
authors = ["rsshogi-nnue Developers"]
description = "Host-only canonical contract for portable .rsnn NNUE packages"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
thiserror = "2"
