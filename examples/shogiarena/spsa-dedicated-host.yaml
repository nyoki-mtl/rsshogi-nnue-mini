experiment_name: "rsshogi-nnue-mini-dedicated-host-search-spsa"
engines:
  - name: "rsshogi-nnue-mini"
    engine_path: "examples/shogiarena/engine-tuning-linux.yaml"
instances:
  - "instances-spsa.yaml"
dashboard:
  enabled: true
  api_port: 8080
rules:
  initial_positions:
    type: file
    source: "openings-train.sfen"
    source_format: sfen
    flip_policy: pair_both
    sync_scope: pair
  repetition_occurrences_to_draw: 2
  time_control:
    node_limit: 100000
  adjudication:
    enable_max_plies: true
    max_plies: 320
    sync_max_plies_with_engine: false
spsa:
  space: "spsa-space.yaml"
  num_updates: 280
  pairs_per_update: 8
  inflight_factor: 1
  num_parallel: 8
  algorithm:
    name: classic
    alpha: 0.602
    gamma: 0.101
    A: {mode: ratio, value: 0.1}
  variants:
    pairing: plus_minus
    crn: true
    integer_rounding: stochastic
    apply:
      clear_hash: true
      after_setoption: isready
